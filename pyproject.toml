[project]
name = "mcp-mixsearch"
version = "1.0.0"
description = "MCP server for web search with multi-engine support and content extraction"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Geovanny F. Fajardo", email = "gffajardo@gmail.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "web-search",
    "fastmcp",
    "ai-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "fastmcp>=4.1.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "httpx>=0.25.0",
    "fake-useragent>=1.4.0",
    "mcp-service-kit @ git+https://github.com/geosp/mcp-service-kit@v0.2.1",
    "ddgs>=9.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mcp-mixsearch = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the runtime code, not repo files like .vscode/ or docker/
only-include = ["server.py", "config.py", "features"]

[tool.hatch.metadata]
allow-direct-references = true
