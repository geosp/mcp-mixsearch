[project]
name = "mcp-mixsearch"
version = "1.0.0"
description = "MCP server for web search with multi-engine support and content extraction"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Geovanny F. Fajardo", email = "gffajardo@gmail.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "web-search",
    "fastmcp",
    "ai-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "python-dotenv>=1.2.4",
    "aiohttp>=3.14.5",
    "fastmcp>=4.1.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    # Pinned exactly: must match the playwright the Dockerfile installs browsers with
    "playwright==1.64.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "httpx>=0.28.1",
    "fake-useragent>=2.2.0",
    "mcp-service-kit @ git+https://github.com/geosp/mcp-service-kit@v0.2.1",
    "ddgs>=9.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[project.scripts]
mcp-mixsearch = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship only the runtime code, not repo files like .vscode/ or docker/
only-include = ["server.py", "config.py", "features"]

[tool.hatch.metadata]
allow-direct-references = true
