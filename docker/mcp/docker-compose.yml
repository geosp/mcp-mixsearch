# Fixed project name: the folder name alone (mcp/prod) collides with other projects
name: mcp-mixsearch

services:
  mcp-mixsearch:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: mcp-mixsearch
    volumes:
      - ../..:/app
    working_dir: /app
    command: ["--from", ".", "mcp-mixsearch", "--mode", "http"]
    ports:
      # Host port: override with MCP_HOST_PORT=3002 docker compose up -d
      - "${MCP_HOST_PORT:-3000}:3000"
    environment:
      - UV_CACHE_DIR=/tmp/uv-cache
      - MCP_AUTH_ENABLED=false
    restart: unless-stopped