# Fixed project name: the folder name alone (mcp/prod) collides with other projects
name: mcp-mixsearch

services:
  mcp-mixsearch:
    # The image holds the app; pin a release tag (e.g. :v1.2.0) to pin the code
    image: ghcr.io/geosp/mcp-mixsearch:main
    container_name: mcp-mixsearch
    ports:
      # Host port: override with MCP_HOST_PORT=3002 docker compose up -d
      - "${MCP_HOST_PORT:-3000}:3000"
    environment:
      # The server has no auth provider; put an authenticating gateway in front
      - MCP_AUTH_ENABLED=false
    restart: unless-stopped
