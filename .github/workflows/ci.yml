name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes full version tags only (no floating v10)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        # Offline tests only; live tests need network access (uv run pytest -m live)
        run: uv run pytest
