name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

# Pushes to main queue in order; a new push to a PR cancels its older run.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` follows main only; version tags never move it
          flavor: |
            latest=false
          tags: |
            # Branch-based tags
            type=ref,event=branch

            # Pull request tags
            type=ref,event=pr

            # Semantic version tags (when tagging with v1.2.3)
            type=ref,event=tag

            # Additional semver patterns
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            # SHA-based tags for uniqueness
            type=sha

            # Latest tag: pushes to the default branch only
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once and load it locally: the image that is tested is the image that is pushed
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: .github/scripts/docker_smoke.sh "$IMAGE"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main and latest move only to the tip of main, so re-running an old run can't move them
      # back; sha and version tags are always pushed
      - name: Push the tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO_URL: https://github.com/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tip="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              *:main|*:latest)
                if [ "$tip" != "$SHA" ]; then
                  echo "skip $tag: $SHA is no longer the tip of main ($tip)"
                  continue
                fi
                ;;
            esac
            docker push "$tag"
          done <<< "$TAGS"
