name: Task
description: Planned work - a feature, a fix with a known cause, a tooling or documentation change.
title: "<area>: <short description>"
body:
  - type: markdown
    attributes:
      value: |
        Changes to behavior, interfaces or the project's constraints need an implementation plan in `docs/plans/` (Skill Central `impl-plan`). Small changes can go straight to a PR.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this delivers and why it is needed now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes, including the tests that prove them.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: plan
    attributes:
      label: Plan
      description: The implementation plan and phase, for example "docs/plans/YYYY-MM-DD-<slug>, phase 01", or "none".
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Related issues, ADRs, dependencies, open questions.
